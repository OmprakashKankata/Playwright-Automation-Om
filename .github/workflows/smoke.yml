name: Smoke Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      AMAZON_EMAIL: ${{ secrets.AMAZON_EMAIL }}
      AMAZON_PASSWORD: ${{ secrets.AMAZON_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke test only
        run: npx playwright test tests/smoke/login-smoke.spec.js --project=chromium --grep "@smoke"
